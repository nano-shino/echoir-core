# Windows x64 builds. MSVC + Ninja. The cpu-x64 job (preset windows-cpu-x64) runs the unit and
# integration tests, and so do the e2e cases. The models are fetched by tools/fetch-models.ps1 and
# cached. A case whose model is missing skips; the Qwen 1.7B case does not fetch its 2.2 GB model
# here and skips. The vulkan-x64 job (preset windows-vulkan-x64) only builds: the runners have no GPU.
name: windows

on:
  push:
    branches: [main]
    paths-ignore: &unbuilt
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES"
      - "bindings/csharp/**"
      - "tools/package-*"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *unbuilt
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_VERSION: 1.4.321.1

# The cpu-x64 job runs in four shards on separate runners, so the e2e cases run in parallel. Each
# shard builds the same tree (ccache makes that cheap) and runs one part of the tests. The shards
# are the non-e2e tests, the Whisper e2e cases, and the Qwen e2e cases split by policy. On pull
# requests a shard also leaves out the cases that repeat another one: the voa clip (ep345 covers
# the long-clip path) and the ep180 stdin pair (the same clip as ep180 stream, through stdin). Pushes
# to main run every case.
jobs:
  cpu-x64:
    name: cpu-x64 (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            include: '.'
            exclude: '^e2e\.'
            pr_exclude: ''
          - shard: e2e-whisper
            include: '^e2e\.whisper_'
            exclude: '^$'
            pr_exclude: 'voa'
          - shard: e2e-qwen-rollback
            include: '^e2e\.qwen_.*rollback'
            exclude: '^$'
            pr_exclude: 'voa'
          - shard: e2e-qwen
            include: '^e2e\.qwen_'
            exclude: 'rollback'
            pr_exclude: 'ep180_stdin'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            models/*.bin
            models/*.gguf
          key: models-${{ hashFiles('models/registry.json') }}-e2e

      - name: Fetch models
        shell: pwsh
        run: tools/fetch-models.ps1 whisper-tiny-en whisper-large-v3-turbo-q5_0 silero-v6.2.0 qwen3-asr-0.6b-q8_0 firered-vad-v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-cpu-x64
          max-size: 2G

      # ccache cannot cache objects compiled with /Zi (shared PDB), so debug info goes into the objects (/Z7).
      - name: Configure
        run: >-
          cmake --preset windows-cpu-x64
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset windows-cpu-x64

      - name: Compiler cache stats
        run: ccache -s

      # The generated fixtures (runon_en, silence_30s) come from the committed clips with
      # the stdlib only.
      - name: Generated fixtures
        shell: pwsh
        run: python -I tools/make-fixtures.py

      # -V prints every test's output, so the doctest summary and the SKIP lines are visible.
      - name: Test
        env:
          CTEST_INCLUDE: ${{ matrix.include }}
          CTEST_EXCLUDE: ${{ matrix.exclude }}${{ github.event_name == 'pull_request' && matrix.pr_exclude != '' && format('|{0}', matrix.pr_exclude) || '' }}
        run: ctest --preset windows-cpu-x64 -V -R "$env:CTEST_INCLUDE" -E "$env:CTEST_EXCLUDE"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-x64-${{ matrix.shard }}-testlog
          path: build/windows-cpu-x64/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  vulkan-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The same SDK install as the release workflow. Its glslc compiles the Vulkan shaders.
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $installer --accept-licenses --default-answer --confirm-command install | Out-Host
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "The Vulkan SDK did not install to $sdk." }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          glslc --version | Select-Object -First 1
          cl 2>&1 | Select-Object -First 1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-vulkan-x64
          max-size: 2G

      # The same debug-info and ccache settings as the cpu-x64 job.
      - name: Configure
        run: >-
          cmake --preset windows-vulkan-x64
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset windows-vulkan-x64

      - name: Compiler cache stats
        run: ccache -s
