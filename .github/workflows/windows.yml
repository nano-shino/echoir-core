# Windows x64 build and tests. MSVC + Ninja, preset windows-cpu-x64.
# Unit and integration tests run, and so do the e2e cases. The models are fetched by
# tools/fetch-models.ps1 and cached. A case whose model is missing skips; the Qwen 1.7B case does not
# fetch its 2.2 GB model here and skips.
name: windows

on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: &unbuilt
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES"
      - "bindings/csharp/**"
      - "tools/package-*"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *unbuilt
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            models/*.bin
            models/*.gguf
          key: models-${{ hashFiles('models/registry.json') }}-e2e

      - name: Fetch models
        shell: pwsh
        run: tools/fetch-models.ps1 whisper-tiny-en whisper-large-v3-turbo-q5_0 silero-v6.2.0 qwen3-asr-0.6b-q8_0 firered-vad-v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-cpu-x64
          max-size: 2G

      # ccache cannot cache objects compiled with /Zi (shared PDB), so debug info goes into the objects (/Z7).
      - name: Configure
        run: >-
          cmake --preset windows-cpu-x64
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset windows-cpu-x64

      - name: Compiler cache stats
        run: ccache -s

      # The generated fixtures (runon_en, silence_30s) come from the committed clips with
      # the stdlib only.
      - name: Generated fixtures
        shell: pwsh
        run: python -I tools/make-fixtures.py

      # -V prints every test's output, so the doctest summary and the SKIP lines are visible.
      - name: Test
        run: ctest --preset windows-cpu-x64 -V

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-x64-testlog
          path: build/windows-cpu-x64/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
